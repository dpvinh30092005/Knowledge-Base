<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OAuth Login Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --accent-google: #4285f4;
    --accent-github: #e6edf3;
    --text: #e6edf3;
    --muted: #6e7681;
    --success: #3fb950;
    --error: #f85149;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 60% 40%, rgba(66,133,244,0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 70%, rgba(230,237,243,0.04) 0%, transparent 50%);
    animation: auraPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  @keyframes auraPulse {
    0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
    100% { transform: scale(1.1) rotate(5deg); opacity: 1; }
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #4285f4, #34a853);
    border-radius: 10px;
    margin-bottom: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 36px;
    letter-spacing: 0.5px;
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0;
    color: var(--muted);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .btn {
    width: 100%;
    padding: 14px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn:hover::before { opacity: 1; }
  .btn:active { transform: scale(0.98); }

  .btn-google::before { background: rgba(66,133,244,0.1); }
  .btn-google:hover { border-color: rgba(66,133,244,0.5); }

  .btn-github::before { background: rgba(230,237,243,0.05); }
  .btn-github:hover { border-color: rgba(230,237,243,0.3); }

  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Token section */
  .token-section {
    display: none;
    margin-top: 28px;
    padding: 16px;
    background: rgba(63,185,80,0.05);
    border: 1px solid rgba(63,185,80,0.2);
    border-radius: 10px;
    animation: fadeIn 0.4s ease;
  }

  .token-section.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .token-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--success);
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }

  .token-label::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .token-value {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.6;
  }

  .user-info {
    display: none;
    margin-top: 20px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    animation: fadeIn 0.4s ease;
  }

  .user-info.show { display: block; }

  .user-row {
    display: flex; justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .user-row:last-child { border-bottom: none; }
  .user-key { color: var(--muted); }
  .user-val { color: var(--text); font-weight: 500; }

  .btn-logout {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(248,81,73,0.3);
    background: transparent;
    color: var(--error);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover {
    background: rgba(248,81,73,0.1);
  }

  /* Config note */
  .config-note {
    margin-top: 24px;
    padding: 12px;
    background: rgba(66,133,244,0.05);
    border: 1px solid rgba(66,133,244,0.15);
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
  }

  .config-note code {
    color: #4285f4;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🔐</div>
  <h1>Sign in</h1>
  <p class="subtitle">// OAUTH2 DEMO — REDIRECT FLOW</p>

  <div id="loginView">
    <button class="btn btn-google" onclick="loginWith('google')">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <button class="btn btn-github" onclick="loginWith('github')">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      Continue with GitHub
    </button>

    <div class="config-note">
      ⚙️ Đổi <code>BACKEND_URL</code> và <code>REDIRECT_URI</code><br>
      trong script để kết nối BE thật của bạn.
    </div>
  </div>

  <div id="loggedView" style="display:none">
    <div class="token-section show">
      <div class="token-label">ACCESS TOKEN (localStorage)</div>
      <div class="token-value" id="tokenDisplay"></div>
    </div>

    <div class="user-info show" id="userInfo"></div>

    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</div>

<script>
  // ============================================================
  // CONFIG — đổi theo BE của bạn
  // ============================================================
  const CONFIG = {
    BACKEND_URL: 'http://localhost:8080',
    // Trang này chính là callback page (FE đọc token từ URL)
    REDIRECT_URI: window.location.href.split('?')[0],
  };

  // ============================================================
  // STEP 1: Redirect sang BE để bắt đầu OAuth
  // BE sẽ redirect sang Google/GitHub
  // ============================================================
  function loginWith(provider) {
    const url = `${CONFIG.BACKEND_URL}/oauth2/authorization/${provider}`;
    window.location.href = url;
  }

  // ============================================================
  // STEP 2: FE đọc token từ URL sau khi BE redirect về
  // URL dạng: /callback?token=eyJhbGci...
  // ============================================================
  function handleCallback() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) return;

    // Lưu vào localStorage
    localStorage.setItem('access_token', token);

    // Xoá token khỏi URL (bảo mật hơn)
    window.history.replaceState({}, document.title, window.location.pathname);

    showLoggedIn(token);
  }

  // ============================================================
  // STEP 3: Gọi API với Bearer token
  // ============================================================
  async function fetchUserInfo(token) {
    const res = await fetch(`${CONFIG.BACKEND_URL}/api/me`, {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    if (!res.ok) throw new Error('Unauthorized');
    return res.json();
  }

  // ============================================================
  // UI helpers
  // ============================================================
  function showLoggedIn(token) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('loggedView').style.display = 'block';

    // Hiển thị token (truncated)
    document.getElementById('tokenDisplay').textContent =
      token.slice(0, 40) + '...' + token.slice(-10);

    // Decode payload JWT để hiện thị (không verify — chỉ demo)
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      const userInfo = document.getElementById('userInfo');
      const rows = [
        ['sub',      payload.sub || '—'],
        ['email',    payload.email || '—'],
        ['name',     payload.name || '—'],
        ['provider', payload.provider || '—'],
        ['exp',      payload.exp ? new Date(payload.exp * 1000).toLocaleString() : '—'],
      ];
      userInfo.innerHTML = rows.map(([k, v]) =>
        `<div class="user-row">
          <span class="user-key">${k}</span>
          <span class="user-val">${v}</span>
        </div>`
      ).join('');
    } catch(e) {
      // Token không decode được (mock token)
      document.getElementById('userInfo').innerHTML =
        `<div class="user-row">
          <span class="user-key">status</span>
          <span class="user-val" style="color:var(--success)">✓ logged in</span>
        </div>`;
    }
  }

  function logout() {
    localStorage.removeItem('access_token');
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('loggedView').style.display = 'none';
  }

  // ============================================================
  // INIT: kiểm tra URL có token không (callback), hoặc đã login
  // ============================================================
  (function init() {
    // Ưu tiên đọc từ URL (vừa được BE redirect về)
    const params = new URLSearchParams(window.location.search);
    if (params.get('token')) {
      handleCallback();
      return;
    }

    // Nếu đã có token trong localStorage
    const saved = localStorage.getItem('access_token');
    if (saved) {
      showLoggedIn(saved);
    }
  })();
</script>
</body>
</html>
