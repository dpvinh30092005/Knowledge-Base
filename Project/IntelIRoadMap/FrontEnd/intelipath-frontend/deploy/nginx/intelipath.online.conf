# Nginx site config for intelipath.online (frontend + API reverse proxy)
#
# NOTE: The canonical/source-of-truth copy lives in the `infrastructure` repo at
#   infrastructure/nginx/intelipath.online.conf
# This copy is kept alongside the frontend on purpose: it makes the deploy story
# easy to show and explain in a demo (the SPA fallback + how /api is proxied to the
# backend live right next to the app they serve). If you change one, change both.
#
# Install to: /etc/nginx/sites-available/intelipath.online
# then:  sudo ln -s /etc/nginx/sites-available/intelipath.online /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# This is the HTTP (port 80) starting point. Running
#   sudo certbot --nginx -d intelipath.online -d www.intelipath.online
# rewrites this file in place: it adds the TLS (443) server block and turns
# this port-80 block into an HTTP->HTTPS redirect. You do not edit TLS by hand.

server {
    listen 80;
    listen [::]:80;
    server_name intelipath.online www.intelipath.online;

    # Frontend: the built React app (Vite `dist/`) copied to this directory.
    root /var/www/intelipath;
    index index.html;

    # Uploads (transcript PDF, avatars) — keep in step with the backend's
    # spring.servlet.multipart.max-request-size (30MB). A little headroom.
    client_max_body_size 32M;

    # --- API + OAuth: proxy to the backend container (bound to localhost only) ---
    # One location per path prefix the backend owns. Everything else falls
    # through to the SPA handler below.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring OAuth2 login entry point (buildOAuthAuthorizationUrl -> /oauth2/authorization/{provider}).
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring OAuth2 provider callback (Google/GitHub redirect here: /login/oauth2/code/{provider}).
    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend SPA fallback: any non-API path serves index.html so client-side
    #     routing (React Router) works on deep links / refresh. ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
