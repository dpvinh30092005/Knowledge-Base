    <!--
      Type system. The binding constraint is Vietnamese: stacked diacritics
      (ề, ữ, ậ) either exist in a face or they don't, and a face that lacks them
      falls back mid-line and changes weight inside a word.

      Checked against the Google Fonts API rather than assumed:
        Press Start 2P    latin only              rejected — no Vietnamese
        Silkscreen        latin only              rejected — no Vietnamese
        Pixelify Sans     latin, latin-ext        rejected — no Vietnamese
        Space Grotesk     vietnamese + latin-ext  kept  (display)
        Be Vietnam Pro    vietnamese + latin-ext  kept  (body)
        JetBrains Mono    vietnamese + latin-ext  kept  (mono)

      Which is why the pixel register on this page is DRAWN — the cell grid,
      square bullets, stepped rules, corner ticks — and never typeset. A pixel
      headline would have cost the language.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
