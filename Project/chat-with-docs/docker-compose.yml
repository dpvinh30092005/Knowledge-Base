services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatwithdocs-postgres
    environment:
      POSTGRES_DB: chatwithdocs
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
