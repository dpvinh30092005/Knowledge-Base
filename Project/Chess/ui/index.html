<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Game UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <section class="board-panel">
      <h1>Chess Game</h1>
      <p class="subtitle">Click a piece, then click destination square.</p>
      <div id="board" class="board" aria-label="Chess Board"></div>
      <div class="files">
        <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
      </div>
    </section>

    <aside class="side-panel">
      <div class="card">
        <h2>Status</h2>
        <p id="turnLabel">Turn: White</p>
        <p id="selectedLabel">Selected: none</p>
      </div>

      <div class="card">
        <h2>Move Input</h2>
        <form id="moveForm">
          <label for="moveText">Format: e2 e4</label>
          <input id="moveText" name="moveText" placeholder="e2 e4" autocomplete="off">
          <button type="submit">Play Move</button>
        </form>
      </div>

      <div class="card">
        <h2>Controls</h2>
        <button id="resetBtn" type="button">Reset Board</button>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
