<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinh's Digital Office</title>
    <link rel="stylesheet" href="css/base.css" />

  </head>
  <body>
    <nav class="navbar">
      <div class="logo"><a href="index.html">Vinh's Digital Office</a></div>
      <ul class="nav-links">

    <main class="hero-section">

        <p>
          I build useful things, break them, then rebuild them better. Welcome

        <div class="tags">
          <span class="tag">#Developer</span>

          <span class="tag">#Rebuilder</span>
        </div>

      <div class="hero-image">
        <div class="image-wrapper">
          <img
            src="assets/illustrations/desk/welcomehero.png"
            alt="Hero"
            class="main-img"

          <div class="dot dot-blue"></div>
          <div class="dot dot-purple"></div>
