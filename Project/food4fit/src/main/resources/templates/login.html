<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - food4fit</title>
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Left Section - Logo -->
        <div class="left-section">
            <div class="logo-container">
                <div class="logo">
                    <div class="leaf-icon">
                        <i class="fas fa-dumbbell"></i>
                    </div>
                    <div class="logo-text">
                        <span class="food">food</span><span class="fit">4fit</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Section - Login Form -->
        <div class="right-section">
            <div class="login-box">
                <h1 class="login-title">LOGIN</h1>
                
                <form class="login-form" action="/login" method="post">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="text" name="username" placeholder="Enter your username" class="form-input" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" placeholder="Enter your password" class="form-input" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember-me">
                            <span>Remember Me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password</a>
                    </div>
                    
                    <button type="submit" class="login-button">LOGIN</button>
                </form>
                
                <p class="register-link">
                    Don't have an account? <a href="/register">Register</a>
                </p>
                
                <div class="social-login">
                    <a href="#" class="social-icon facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="social-icon google">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-icon apple">
                        <i class="fab fa-apple"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
